# 記事を更新（masterにpush）すると、Vercelのデプロイが終わる頃に、IndexNowでBingなどへ通知する。
# 不要な場合は、このファイルを削除すれば止まります。
name: IndexNow

on:
  push:
    branches: [master]
    paths:
      - "src/articles/**"
      - "src/lib/topics.ts"
  workflow_dispatch:
    inputs:
      all:
        description: "サイトマップの全URLを送る"
        type: boolean
        default: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit URLs to IndexNow
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs --changed --wait=150
          fi
